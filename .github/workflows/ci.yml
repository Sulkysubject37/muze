name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true

    steps:
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Official Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          ZIG_DIR="$RUNNER_TEMP/zig"
          mkdir -p "$ZIG_DIR"

          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi

          case "$RUNNER_OS" in
            Linux)
              FILE="zig-${ARCH}-linux-${ZIG_VERSION}.tar.xz"
              ;;
            macOS)
              FILE="zig-${ARCH}-macos-${ZIG_VERSION}.tar.xz"
              ;;
            Windows)
              FILE="zig-x86_64-windows-${ZIG_VERSION}.zip"
              ;;
            *)
              echo "Unsupported OS: $RUNNER_OS"
              exit 1
              ;;
          esac

          URL="https://ziglang.org/download/${ZIG_VERSION}/${FILE}"
          echo "Fetching Zig ${ZIG_VERSION} from: ${URL}"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/${FILE}"

          echo "Extracting ${FILE} into ${ZIG_DIR}..."
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x "$RUNNER_TEMP/${FILE}" -o"$RUNNER_TEMP/extracted" -y
            mv "$RUNNER_TEMP/extracted/zig-x86_64-windows-${ZIG_VERSION}/"* "$ZIG_DIR/"
          else
            tar -xf "$RUNNER_TEMP/${FILE}" -C "$ZIG_DIR" --strip-components=1
          fi

          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Build Optimized MUZE Binary
        shell: bash
        run: zig build -Doptimize=ReleaseFast --summary all

      - name: Verify Executable CLI Boot
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./zig-out/bin/muze.exe --help
          else
            ./zig-out/bin/muze --help
          fi

      - name: Run Core Algorithm Dual-Oracle Tests
        shell: bash
        run: zig test src/sandbox_safe.zig -lc -I vendor/tree-sitter/lib/include
